<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal Card</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container my-4">
      <div class="mb-4">
        <button type="button" class="btn btn-primary">Primary</button>
        <button type="button" class="btn btn-success">Success</button>
        <button type="button" class="btn btn-danger">Danger</button>
      </div>

      <p class="text-start">Left</p>
      <p class="text-center text-danger">Center</p>
      <p class="text-end">Right</p>
      <div class="row justify-content-center">
        <div class="col-12 col-sm-6 col-lg-4">
          <div class="card mx-auto">
            <div class="card-header">My Profile</div>
            <img
              src="https://cataas.com/cat?position=center"
              class="card-img-top"
              alt="Avatar"
            />
            <ul class="list-group list-group-flush">
              <li class="list-group-item">Name: Jessica Manturano</li>
              <li class="list-group-item">City: Lima</li>
              <li class="list-group-item">Hobby: Watch movies, drink coffee</li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
